<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }
      .navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 24px;
        background: #ffffff;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      }
      .logo {
        font-weight: bold;
        font-size: 20px;
      }
      .user {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        object-fit: cover;
        background: #ccc;
      }
      .avatar-letra {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: #888;
        color: #fff;
        display: none;
        align-items: center;
        justify-content: center;
        font-weight: bold;
      }
      #btn-sair {
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fff;
        cursor: pointer;
      }
      #btn-sair:hover {
        background: #eee;
      }
      main {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo">Logo</div>

      <div class="user">
        <img id="user-foto" class="avatar" alt="Foto do usuário" referrerpolicy="no-referrer" style="display: none" />
        <div id="user-letra" class="avatar-letra"></div>
        <span id="user-nome"></span>
        <button id="btn-sair" type="button">Sair</button>
      </div>
    </nav>

    <main>
      <h1>Você está logado!</h1>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
      const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      async function iniciar() {
        const {
          data: { session },
        } = await supabaseClient.auth.getSession();

        // se não estiver logado, volta para o login
        if (!session) {
          window.location.href = "Auth.html";
          return;
        }

        const user = session.user;
        const meta = user.user_metadata || {};

        // Google usa full_name/name; o cadastro por e-mail usa "nome"
        const nome = meta.full_name || meta.name || meta.nome || user.email;
        const foto = meta.avatar_url || meta.picture;

        document.getElementById("user-nome").textContent = nome;

        const img = document.getElementById("user-foto");
        const letra = document.getElementById("user-letra");

        if (foto) {
          img.src = foto;
          img.style.display = "block";
        } else {
          //mostra a inicial do nome
          letra.textContent = nome.charAt(0).toUpperCase();
          letra.style.display = "flex";
        }
      }

      document.getElementById("btn-sair").addEventListener("click", async () => {
        await supabaseClient.auth.signOut();
        window.location.href = "Auth.html";
      });

      iniciar();
    </script>
  </body>
</html>
