<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" type="image/png" href="../assets/img/ui/LogoFav.png">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Login / Cadastro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Montserrat:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Auth.css" />
  
<script>
(function(c,l,a,r,i,t,y){
    c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
    t=l.createElement(r);t.async=1;
    t.src="https://www.clarity.ms/tag/"+i;
    y=l.getElementsByTagName(r)[0];
    y.parentNode.insertBefore(t,y);
})(window,document,"clarity","script","yv8exlboqb");
</script>

    
      
</head>
  <body>
    <div class="panel">
      <div class="card">
        <!-- ===================== TELA DE LOGIN ===================== -->
        <div id="screen-login" class="screen active">
          <div class="hero">
            <nav class="menu" id="menu"></nav>

            <img
              class="hero-pets"
              src="/img/CachorroGatoLogin.png"
              alt="Um cachorro e um gato olhando para cima"
            />
          </div>

          <h1>Bem-vindo de volta!</h1>
          <p class="subtitle">Faça login para continuar</p>

          <div class="auth-body">
            <figure class="pet-side">
              <img src="/img/GatoLogin.png" alt="Gatinho deitado" />
            </figure>

            <form id="form-login">
              <label for="login-email">E-mail</label>
              <input id="login-email" type="email" required placeholder="" />

              <label for="login-senha">Senha</label>
              <input
                id="login-senha"
                type="password"
                required
                minlength="6"
                placeholder="Mínimo de 6 caracteres"
              />

              <button class="btn-primary" type="submit" id="btn-login">
                Login
              </button>
            </form>
          </div>

          <div class="divider"><span>OU</span></div>
          <div class="social-label">Entrar com sua conta</div>
          <button class="btn-social" type="button" id="btn-google-login">
            Google
          </button>

          <div id="message-login" class="message"></div>

          <p class="footer-link">
            Ainda não tem conta?
            <button type="button" class="link-to-cadastro link-btn">
              Cadastre-se
            </button>
          </p>
        </div>

        <!-- ===================== TELA DE CADASTRO ===================== -->
        <div id="screen-cadastro" class="screen">
          <div class="hero">
            <nav class="menu" id="menu"></nav>
            <img
              class="hero-pets"
              src="/img/GatoCoelhoBemVindo.png"
              alt="Dois gatinhos e um coelho juntos"
            />
          </div>

          <h1>Seja Bem-Vindo</h1>
          <p class="subtitle">Faça cadastro para continuar</p>

          <div class="auth-body">
            <figure class="pet-side">
              <img
                src="/img/PapagaioBemVindo.png"
                alt="Duas calopsitas no poleiro"
              />
            </figure>

            <form id="form-cadastro">
              <label for="cad-nome">Nome de usuário</label>
              <input id="cad-nome" type="text" required placeholder="" />

              <label for="cad-email">E-mail</label>
              <input id="cad-email" type="email" required placeholder="" />

              <label for="cad-senha">Senha</label>
              <input
                id="cad-senha"
                type="password"
                required
                minlength="6"
                placeholder="Mínimo de 6 caracteres"
              />

              <label for="cad-senha-confirma">Confirmar Senha</label>
              <input
                id="cad-senha-confirma"
                type="password"
                required
                minlength="6"
                placeholder=""
              />
            </form>
          </div>

          <button
            class="btn-primary btn-wide"
            type="submit"
            id="btn-cadastro"
            form="form-cadastro"
          >
            Cadastrar
          </button>

          <div id="message-cadastro" class="message"></div>

          <p class="terms">
            Ao preencher o formulário acima você concorda com os nossos
            <a href="./PoliticaDePrivacidade.html">Termos de uso</a> e nossa
            <a href="./PoliticaDePrivacidade.html">Política de Privacidade</a>
          </p>
          <p class="footer-link">
            Já tem uma conta?
            <button type="button" class="link-to-login link-btn">
              Fazer login
            </button>
          </p>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="Auth.js"></script>
    <script src="/vlibras.js"></script>
    <script src="/config/Nav.js"></script>
  </body>
</html>
